# Example credentials for local M2 development only. Never use in production.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: school_admission_dev
      POSTGRES_PASSWORD: local_m2_only
      POSTGRES_DB: school_admission
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - admission_dev_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_admission_dev -d school_admission"]
      interval: 2s
      timeout: 5s
      retries: 15

  postgres-tests:
    image: postgres:18
    environment:
      POSTGRES_USER: school_admission_test
      POSTGRES_PASSWORD: local_m2_test_only
      POSTGRES_DB: school_admission_m2_tests
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - admission_test_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_admission_test -d school_admission_m2_tests"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  admission_dev_data:
  admission_test_data:
